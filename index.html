<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Paper Daily：关注数学、计算机科学、网络与信息安全及密码学的论文阅读与研究动态。">
<title>Paper Daily · 论文与研究动态</title>
<style>
:root{color-scheme:light dark;--bg:#f5f7fb;--fg:#18243b;--muted:#526078;--card:#fff;--line:#dbe2ee;--accent:#235ac7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.75 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:960px;margin:auto;padding:64px 24px}header{padding:24px 0 36px}.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.08em}
h1{font-size:clamp(2.4rem,7vw,4rem);line-height:1.15;margin:14px 0}h2{font-size:1.25rem;margin:0 0 12px}
p{margin:12px 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.status{margin:24px 0}.tag{display:inline-block;padding:4px 12px;border:1px solid var(--line);border-radius:99px;margin:4px 6px 4px 0;font-size:.9rem}
a{color:var(--accent);text-underline-offset:4px}a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
ul{padding-left:22px}footer{margin-top:32px;color:var(--muted);font-size:.88rem}
@media(max-width:600px){main{padding:32px 18px}.grid{grid-template-columns:1fr}}
@media(prefers-color-scheme:dark){:root{--bg:#111827;--fg:#e5eaf4;--muted:#b4bfd2;--card:#1b2537;--line:#344259;--accent:#99bbff}}
</style>
</head>
<body>
<main>
<header><div class="eyebrow">PAPER DAILY</div><h1>论文与研究动态</h1>
<p>聚焦数学、计算机科学、网络与信息安全、密码学，回到原始论文理解方法、结果与局限。</p>
<div aria-label="关注领域"><span class="tag">数学</span><span class="tag">计算机科学</span><span class="tag">网络与信息安全</span><span class="tag">密码学</span></div></header>
<section class="status"><h2>网站初始化</h2><p>首页已准备。本页目前是建站占位页，尚未发布论文摘要，也尚未配置自动更新。</p></section>
<div class="grid">
<section><h2>论文入口</h2><ul><li><a href="https://arxiv.org/">arXiv 预印本</a></li><li><a href="https://eprint.iacr.org/">IACR Cryptology ePrint Archive</a></li><li><a href="https://dblp.org/">DBLP 文献索引</a></li></ul></section>
<section><h2>阅读原则</h2><p>区分预印本与正式发表，注明论文版本与原始来源。作者的结论不等于本站已独立验证的结论。</p></section>
</div>
<footer><a href="https://github.com/wang2000star/paper-daily">查看网站源码</a> · Paper Daily</footer>
</main>
</body>
</html>
